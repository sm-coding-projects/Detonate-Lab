# Detonate Lab edge: serves the SPA and reverse-proxies /api to the backend.
# Included inside the base image's http{} block, so limit_req_zone is valid here.

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=12r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 110m;          # 100 MB samples + overhead
    proxy_request_buffering off;        # stream large uploads to the backend

    # --- Security headers (applied to every response, including proxied) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Enable when serving over HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- Shared proxy settings (inherited by /api locations) ---
    # Docker's embedded DNS + a variable upstream so the backend IP is
    # re-resolved per request (survives backend container restarts instead of
    # caching a dead IP at startup).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream backend;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite (not append) so a client-supplied X-Forwarded-For can't spoof
    # the upstream's notion of the client IP (used by the login throttle).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # Edge healthcheck (no proxy).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Stricter limits on auth endpoints (brute-force defense).
    location = /api/auth/login {
        limit_req zone=auth burst=8 nodelay;
        proxy_pass http://$api_upstream:8000$request_uri;
    }
    location = /api/auth/register {
        limit_req zone=auth burst=8 nodelay;
        proxy_pass http://$api_upstream:8000$request_uri;
    }

    # General API proxy.
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://$api_upstream:8000$request_uri;
    }

    # Hashed, immutable build assets.
    location /assets/ {
        expires 30d;
        access_log off;
    }

    # SPA fallback (revalidate index.html so deploys propagate).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
