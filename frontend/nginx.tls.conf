# Optional TLS listener. Activated when TLS=1 is set in .env (scripts/init-
# env.sh generates a self-signed cert + key into a compose secret; nginx
# picks up the listener when the secret file is present).
#
# This is the FALLBACK path for labs that don't have a real TLS terminator
# in front of the stack. Production should front the stack with a managed
# cert (Caddy, Traefik, an ALB with ACME, etc.) and leave TLS=0 here so
# nginx serves plain HTTP to the reverse proxy.
#
# The TLS port is fixed at 8443 inside the container. Host-side mapping is
# ${TLS_PORT:-8443}:8443 in docker-compose.yml.

server {
    listen        8443 ssl;
    http2         on;
    server_name   _;
    server_tokens off;

    ssl_certificate     /etc/nginx/secrets/web_tls_cert.pem;
    ssl_certificate_key /etc/nginx/secrets/web_tls_key.pem;

    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers             ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;

    # Mirror of the HSTS `map` in nginx.conf — when the request actually
    # arrives over TLS the `https = on` so the header is emitted.
    include /etc/nginx/security-headers.conf;

    client_max_body_size 110m;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml font/ttf font/otf;

    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}