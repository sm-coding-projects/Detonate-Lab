# Shared security headers. `include`d in every location that sets its own
# add_header (nginx otherwise drops inherited add_headers in such blocks).

# HSTS — $hsts_header is defined by the `map` at the http context in nginx.conf
# so plaintext local dev gets an empty value and HTTPS gets a one-year header.
# `always` (rather than omitted) keeps the response shape consistent across
# status codes, even when the value is empty.
add_header Strict-Transport-Security $hsts_header always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# `style-src 'unsafe-inline'` is currently required because the UI renders
# inline style attributes on a few elements — see docs/SECURITY.md for the
# tracked refactor that would let us drop it.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self'; connect-src 'self'; form-action 'self'; upgrade-insecure-requests" always;
