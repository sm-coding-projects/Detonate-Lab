# Detonate Lab — single-file deployment.
#   docker compose up --build      → open http://localhost:${WEB_PORT:-8080}
#
# Three services on a private network. Only the web tier publishes a port;
# the API and database are not reachable from the host.
#
# Container hardening (Phase A.1):
#   - read_only root FS where the workload allows (DB keeps a writable
#     `pgdata` volume; api/web use tmpfs for the scratch paths they need).
#   - cap_drop: ALL + minimum cap_add (db needs DAC_OVERRIDE/SETUID/SETGID
#     for postgres; api needs CHOWN/SETUID/SETGID for the runtime user).
#   - pids_limit, mem_limit, cpus, init: true (PID 1 signal handling),
#     ulimits.nofile (file-descriptor flood guard), JSON-file logging with
#     rotation. AppArmor profiles are wired via security_opt for the
#     user-facing tiers (the api + web namespaces are the only ones that
#     handle untrusted input directly).

x-log-rotation: &log-rotation
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-base-hardening: &base-hardening
  init: true
  pids_limit: 256
  mem_limit: 512m
  cpus: "1.0"
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  <<: *log-rotation

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-detonate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-detonate}
      POSTGRES_DB: ${POSTGRES_DB:-detonate}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # `docker-entrypoint.sh` needs `/run/postgresql` for the unix socket.
      - type: tmpfs
        target: /run/postgresql
        tmpfs:
          size: 16m
          mode: 1777
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    # Postgres cannot run with a true read-only root because it has to
    # write to its data directory on first init / checkpoint. We scope the
    # data directory to the named `pgdata` volume and keep tmpfs mounts
    # narrow.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    <<: *base-hardening

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-detonate}:${POSTGRES_PASSWORD:-detonate}@db:5432/${POSTGRES_DB:-detonate}
      SANDBOX_CONNECTOR: ${SANDBOX_CONNECTOR:-static}
      SANDBOX_RUNNER_URL: ${SANDBOX_RUNNER_URL:-http://sandbox-runner:8090}
      # Token file path is fixed; the file is mounted from a compose
      # secret when the `sandbox` profile is active. If the file is
      # missing the connector falls back to an empty token (which fails
      # the runner's bearer check) — so a missing token is safe by
      # default, not silently permissive.
      SANDBOX_RUNNER_TOKEN_FILE: ${SANDBOX_RUNNER_TOKEN_FILE:-/run/secrets/sandbox_runner_token}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      RETAIN_BYTES: ${RETAIN_BYTES:-true}
      ANALYSIS_CONCURRENCY: ${ANALYSIS_CONCURRENCY:-2}
      RATE_MAX_REQUESTS: ${RATE_MAX_REQUESTS:-120}
      SUBMIT_MAX_REQUESTS: ${SUBMIT_MAX_REQUESTS:-12}
      TRUST_PROXY: "true"
    volumes:
      - quarantine:/data/quarantine
    networks:
      - internal
    secrets:
      - sandbox_runner_token
    security_opt:
      - no-new-privileges:true
      - apparmor=detonate-api
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=16m,mode=0755
    <<: *base-hardening

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:8080"
      # Host-side TLS listener only published when TLS=1. Compose still
      # binds the internal 8443 port even when unused (the TLS include
      # file short-circuits the listener when not configured).
      - "${TLS_PORT:-8443}:8443"
    networks:
      - internal
    secrets:
      - source: web_basic_auth_htpasswd
        target: /etc/nginx/secrets/web_basic_auth_htpasswd
        mode: 0440
        uid: "101"
        gid: "101"
      - source: web_tls_cert
        target: /etc/nginx/secrets/web_tls_cert.pem
        mode: 0440
        uid: "101"
        gid: "101"
      - source: web_tls_key
        target: /etc/nginx/secrets/web_tls_key.pem
        mode: 0440
        uid: "101"
        gid: "101"
    security_opt:
      - no-new-privileges:true
      - apparmor=detonate-web
    # nginx-unprivileged runs as user `nginx` (uid 101) and binds 8080/8443
    # above the privileged port range, so cap_drop: ALL is safe.
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      # nginx needs scratch space for client body buffering, proxy temp
      # files, and fastcgi cache dirs. All tmpfs, all sized, all owned by
      # nginx.
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=8m,mode=0755
    <<: *base-hardening

  # --------------------------------------------------------------------------
  # Real-detonation tier (profile: sandbox)
  # --------------------------------------------------------------------------
  # These services start only with `docker compose --profile sandbox up -d`.
  # Bringing them up materially expands the attack surface — the runner
  # executes submitted samples — so they're opt-in.
  #
  # Isolation model:
  #   - The sandbox-runner is the only entry point. It runs a hardened
  #     Python service that authenticates api requests via the shared
  #     bearer token, then spawns a docker-in-docker worker.
  #   - The worker runs in its own docker daemon (started inside the
  #     runner via docker-in-docker). That daemon is the only thing the
  #     sample can influence; the host's daemon is never touched.
  #   - INetSim is the only path for sample-originated traffic. It is
  #     reachable from the worker only (via the `sandbox` network) and
  #     exposes nothing to the host or the wider internet.
  #   - The runner's debug surface binds 127.0.0.1:${SANDBOX_RUNNER_PORT}
  #     for human triage — it is NEVER reachable from outside the host
  #     loopback.

  sandbox-runner:
    build:
      context: ./sandbox
    profiles: ["sandbox"]
    restart: unless-stopped
    depends_on:
      - sandbox-inetsim
    environment:
      RUNNER_PORT: "8090"
      INETSIM_URL: http://sandbox-inetsim:80
      RUNNER_TOKEN_FILE: /run/secrets/sandbox_runner_token
      # The runner talks to its own DinD socket (started inside the
      # container), never the host's. This is the entire reason the
      # sandbox runner is its own service: it owns its own docker
      # daemon, and a sample breakout from a worker hits a daemon whose
      # only purpose is to spin more workers, not the host.
      DOCKER_HOST: unix:///run/docker.sock
      DOCKER_NETWORK: sandbox
      DEFAULT_BASE_IMAGE: ${SANDBOX_BASE_IMAGE:-alpine:3.20}
      RUN_TIMEOUT_SECONDS: ${SANDBOX_RUN_TIMEOUT:-90}
    volumes:
      - quarantine:/data/quarantine:ro
      - sandbox_work:/var/lib/docker
      - sandbox_logs:/var/log/sandbox-runner
    networks:
      - internal
      - sandbox
    secrets:
      - sandbox_runner_token
    security_opt:
      - no-new-privileges:true
      - apparmor=detonate-runner
    # DinD needs CHOWN/SETUID/SETGID/SYS_ADMIN (mount) and NET_ADMIN
    # (iptables for the worker's network namespace); we add only those
    # and drop everything else. no-new-privileges is still honored — this
    # is a hint, not a setuid.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - SYS_ADMIN
      - NET_ADMIN
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /run:size=32m,mode=0755
    ports:
      # Localhost-only debug surface for human triage.
      - "127.0.0.1:${SANDBOX_RUNNER_PORT:-8090}:8090"
    <<: *base-hardening

  sandbox-inetsim:
    image: ghcr.io/inetsim/inetsim:1.3.3
    profiles: ["sandbox"]
    restart: unless-stopped
    # INetSim is configured via a small bind-mount that scopes its DNS
    # and default IP. It has NO route to the host, only to the sandbox
    # network — so a sample can talk to fake DNS / HTTP / SMTP / etc.,
    # but never reach the real internet.
    volumes:
      - ./sandbox/inetsim.conf:/etc/inetsim/inetsim.conf:ro
    networks:
      sandbox:
        ipv4_address: 10.55.55.2
    security_opt:
      - no-new-privileges:true
      - apparmor=detonate-sandbox
    read_only: true
    cap_drop:
      - ALL
    # INetSim binds 53, 80, 443, 587, etc. — these are all privileged,
    # so we drop EVERYTHING and add NET_BIND_SERVICE explicitly. The
    # process is initscript-only with no shell, no package manager.
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /var/run:size=8m,mode=0755
      - /tmp:size=32m,mode=1777
      - /var/log/inetsim:size=64m,mode=0755
    <<: *base-hardening

volumes:
  pgdata:
  quarantine:
  sandbox_work:
  sandbox_logs:

networks:
  internal:
    driver: bridge
  # The sandbox network connects the runner to its DinD workers. It is
  # `internal: true` so no traffic crosses to the host network — the
  # only path for sample-originated packets is the runner, which routes
  # them to INetSim on the same network.
  sandbox:
    driver: bridge
    internal: true

secrets:
  # Generated by scripts/init-env.sh when the corresponding profile/feature
  # is enabled. The api reads the runner token from disk at startup so the
  # token never lives in the compose env or process env.
  sandbox_runner_token:
    file: ${SANDBOX_RUNNER_TOKEN_FILE:-./secrets/sandbox_runner_token}
  web_basic_auth_htpasswd:
    file: ${WEB_BASIC_AUTH_HTPASSWD_FILE:-./secrets/web_basic_auth_htpasswd}
  web_tls_cert:
    file: ${WEB_TLS_CERT_FILE:-./secrets/web_tls_cert.pem}
  web_tls_key:
    file: ${WEB_TLS_KEY_FILE:-./secrets/web_tls_key.pem}
