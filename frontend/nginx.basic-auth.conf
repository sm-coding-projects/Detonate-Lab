# Optional HTTP BasicAuth at the web tier. Activated when BASIC_AUTH=1 is
# set in .env (scripts/init-env.sh writes a htpasswd secret file and the
# compose file mounts it; the web entrypoint `include`s this file only
# when the secret is present).
#
# Place inside a server { } block — at the http or server scope. We use
# the location / (SPA) and /api/ (proxy) to require auth on every
# request except the healthcheck.

auth_basic           "Detonate Lab";
auth_basic_user_file /etc/nginx/secrets/web_basic_auth_htpasswd;