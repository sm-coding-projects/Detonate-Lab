# Minimal INetSim configuration for the sandbox profile.
#
# INetSim runs on the `sandbox` compose network at 10.55.55.2 (see
# docker-compose.yml). The worker container uses this address as its
# default route, so ALL outbound traffic from the sample is captured
# here.
#
# Scope: ONLY the services a sandboxed sample is likely to reach for
# when beaconing home (DNS, HTTP/HTTPS, SMTP, IRC). We disable
# services we don't want to emulate (NTP, FTP) so an attempted
# exfil over them fails cleanly rather than producing a misleading
# "success" log entry.

start_service dns
start_service http
start_service https
start_service smtp
start_service smtps
start_service pop3
start_service pop3s
start_service irc
start_service nntp

# Don't start these — they're either not useful for malware research
# or they generate noise we don't want in the audit log:
#   tftp  — used by some loaders; out of scope for PE detonation
#   ftp   — plaintext, rarely seen in modern samples
#   ntp   — flood control evasion; not a meaningful exfil channel
#   dhcp  — we control the network; nothing to lease

# DNS: resolve EVERY name to 10.55.55.2. This keeps the sample talking
# to us instead of giving it a chance to find its real C2.
dns_default_ip 10.55.55.2

# HTTP/HTTPS: respond with a generic 200 + tiny body so the sample
# believes the C2 is up. We don't proxy — that would require
# outbound connectivity, which the sandbox network forbids.
http_fakefile /var/www/inetsim/index.html
https_fakefile /var/www/inetsim/index.html

# Bind to the sandbox network address only.
service_bind_address 10.55.55.2

# Default DNS server for the worker — the runner injects this into
# /etc/resolv.conf via the worker container's --dns flag.
dns_bind_address 10.55.55.2

# Don't run the web UI — we don't need it and it expands the surface.
nohttp_admin 1

# Capture log to a tmpfs path so we don't fill up the container.
log_file /var/log/inetsim/inetsim.log
log_level info

# Smaller response sizes make the audit log readable.
max_servers_per_ip 32
max_connections 256