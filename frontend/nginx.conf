# Detonate Lab — web tier: serves the SPA and reverse-proxies the API.

server {
    listen        8080;
    server_name   _;
    root          /usr/share/nginx/html;
    index         index.html;

    # Allow large sample uploads (matches the API's 100 MB limit, with headroom).
    client_max_body_size 110m;

    # Applied to responses that don't set their own add_header (e.g. /api, /).
    include /etc/nginx/security-headers.conf;

    # ---- Compression -------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml font/ttf font/otf;

    # ---- API reverse proxy -------------------------------------------------
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # ---- Static assets: long cache (content-hashed by Vite) ----------------
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # ---- index.html must never be cached (so new deploys are picked up) -----
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ---- SPA fallback ------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
